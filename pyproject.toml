[project]
name = "industrial-data-lakehouse"
version = "0.1.0"
description = "Industrial Data Lakehouse using PySpark and Delta Lake"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==4.0.1",
    "delta-spark==4.0.0",
    "prefect>=3,<4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
